name: Auto update

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

# 防止定时任务和手动任务并发执行
concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  PAC_PROXY: "SOCKS5 192.168.30.3:7891; PROXY 192.168.30.3:7890; DIRECT;"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/checkout@v4
        with:
          repository: gfwlist/gfwlist
          path: gfwlist

      # 固定 Python 版本：genpac 3.0.1 在新的 Python 上有兼容性问题，
      # 由 tools/genpac_compat.py 处理，这里同时用 3.13 证明兼容层有效。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # genpac 的依赖钉在旧版本，用 --no-deps 安装，避免老版本 PyYAML 编译失败
          python -m pip install --no-deps "genpac==3.0.1"

      - name: Build PAC
        run: |
          set -euo pipefail
          mkdir -p build
          python -m tools.build_pac \
            --gfwlist gfwlist/gfwlist.txt \
            --user-rule-from custom-proxy.txt \
            --proxy "$PAC_PROXY" \
            --output build/gfwlist.pac \
            --baseline-out build/genpac-baseline.pac \
            --sample-urls-out build/parity-urls.txt \
            --strict-urls-out build/boundary-urls.txt

      # 出厂检验：与 genpac 3.0.1 原生模板逐条对拍 + Windows 引擎语法检查
      - name: Verify PAC
        run: |
          set -euo pipefail
          python -m tools.verify_pac \
            --candidate build/gfwlist.pac \
            --baseline build/genpac-baseline.pac \
            --urls build/parity-urls.txt \
            --strict-urls build/boundary-urls.txt
          python -m unittest discover -s tests -v

      - name: Commit
        run: |
          set -euo pipefail
          cp build/gfwlist.pac gfwlist.pac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gfwlist.pac

          # 输出不含构建时间，规则没变时不会产生空提交
          if git diff --cached --quiet; then
            echo "no rule changes"
            exit 0
          fi

          git commit -m "[$(LANG=C date -u)] auto update"

          if [ -n "${{ secrets.READ_ONLY }}" ]; then
            git show --stat HEAD
            echo "READ_ONLY 已设置，仅展示变更不推送"
            exit 0
          fi

          git pull --rebase origin master
          git push origin master
